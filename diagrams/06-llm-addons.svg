<svg viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-r6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- canvas + frame -->
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <rect x="32" y="32" width="1536" height="1036" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- header -->
  <text x="80" y="92" font-size="40" font-weight="700" fill="#0F0F0F" letter-spacing="-0.5">LLM 外挂工具箱</text>
  <text x="80" y="118" font-size="12" font-weight="500" fill="#8C8C8C" letter-spacing="2.5">FIVE ADD-ONS · PLUG-AND-PLAY</text>
  <text x="1520" y="92" font-size="13" font-weight="500" fill="#5C5C5C" text-anchor="end">第 3.2 节 · 能力外挂</text>
  <line x1="32" y1="148" x2="1568" y2="148" stroke="#1A1A1A" stroke-width="1"/>

  <!-- intro -->
  <text x="80" y="194" font-size="14" font-weight="500" fill="#0F0F0F">主骨架之外，业界开发了 5 个"外挂"——可以叠加，让模型在某些维度更强。</text>
  <text x="80" y="216" font-size="13" font-weight="400" fill="#5C5C5C">它们不是同层竞争关系，而是组合工具箱。今天所有顶级 LLM 都是"Transformer + 这些外挂"的复合体。</text>

  <!-- ============ CENTER: Transformer core ============ -->
  <!-- center: cx=800, cy=600 -->
  <!-- dashed circle (orbit boundary) -->
  <circle cx="800" cy="600" r="320" fill="none" stroke="#8C8C8C" stroke-width="0.5" stroke-dasharray="3 5"/>

  <!-- core block -->
  <rect x="700" y="540" width="200" height="120" fill="#1A1A1A"/>
  <text x="800" y="572" font-size="11" font-weight="700" fill="#FAFAF7" letter-spacing="2" text-anchor="middle">CORE</text>
  <text x="800" y="608" font-size="22" font-weight="700" fill="#FAFAF7" text-anchor="middle">Transformer</text>
  <text x="800" y="636" font-size="12" font-weight="500" fill="#C0C0C0" text-anchor="middle">decoder-only</text>

  <!-- ============ 5 satellites ============ -->
  <!-- positions: 5 satellites on a circle r=320 around (800, 600) -->
  <!-- angle 0 = right; we'll do: top, top-right, bottom-right, bottom-left, top-left -->
  <!-- angle 90 (top): (800, 280) -->
  <!-- angle 18 (top-right): (800+320*cos(18), 600-320*sin(18)) = (800+304, 600-99) = (1104, 501) -->
  <!-- angle -54 (bottom-right): (800+320*cos(-54), 600-320*sin(-54)) = (800+188, 600+259) = (988, 859) -->
  <!-- angle -126 (bottom-left): (800-188, 600+259) = (612, 859) -->
  <!-- angle 162 (top-left): (800-304, 600-99) = (496, 501) -->

  <!-- ===== TOP: MoE ===== -->
  <line x1="800" y1="540" x2="800" y2="380" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="640" y="240" width="320" height="140" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="660" y="272" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">PLUG 01</text>
  <text x="660" y="306" font-size="24" font-weight="700" fill="#0F0F0F">MoE</text>
  <text x="660" y="328" font-size="12" font-weight="500" fill="#5C5C5C">混合专家</text>

  <!-- visual: 8 small expert boxes, with router arrow -->
  <g transform="translate(800, 250)">
    <line x1="0" y1="20" x2="0" y2="50" stroke="#1A1A1A" stroke-width="1" marker-end="url(#arr-r6)"/>
    <text x="0" y="14" font-size="10" font-weight="500" fill="#5C5C5C" text-anchor="middle">token</text>
    <!-- router -->
    <rect x="-22" y="52" width="44" height="14" fill="#1A1A1A"/>
    <text x="0" y="63" font-size="9" font-weight="600" fill="#FAFAF7" text-anchor="middle">Router</text>
    <!-- 4 experts shown -->
    <rect x="-72" y="80" width="32" height="20" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="-56" y="93" font-size="9" font-weight="500" fill="#0F0F0F" text-anchor="middle">E₁</text>
    <rect x="-36" y="80" width="32" height="20" fill="#1A1A1A"/>
    <text x="-20" y="93" font-size="9" font-weight="600" fill="#FAFAF7" text-anchor="middle">E₂</text>
    <rect x="0" y="80" width="32" height="20" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="16" y="93" font-size="9" font-weight="500" fill="#0F0F0F" text-anchor="middle">E₃</text>
    <rect x="36" y="80" width="32" height="20" fill="#1A1A1A"/>
    <text x="52" y="93" font-size="9" font-weight="600" fill="#FAFAF7" text-anchor="middle">E₄</text>
    <text x="0" y="120" font-size="9" font-weight="400" fill="#8C8C8C" text-anchor="middle">选 top-k = 2（黑色=激活）</text>
  </g>

  <text x="660" y="362" font-size="11" font-weight="500" fill="#5C5C5C">Mixtral 8×7B · Switch · Jamba</text>

  <!-- ===== TOP-RIGHT: Flash Attention ===== -->
  <line x1="828" y1="572" x2="1080" y2="528" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="1080" y="400" width="360" height="180" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1100" y="432" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">PLUG 02</text>
  <text x="1100" y="466" font-size="24" font-weight="700" fill="#0F0F0F">Flash Attention</text>
  <text x="1100" y="488" font-size="12" font-weight="500" fill="#5C5C5C">IO 感知 attention 实现</text>

  <!-- visual: GPU HBM → SRAM arrows showing IO reduction -->
  <g transform="translate(1100, 500)">
    <rect x="0" y="0" width="80" height="40" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="40" y="24" font-size="11" font-weight="600" fill="#0F0F0F" text-anchor="middle">HBM</text>
    <line x1="80" y1="20" x2="160" y2="20" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r6)"/>
    <rect x="160" y="0" width="80" height="40" fill="#1A1A1A"/>
    <text x="200" y="24" font-size="11" font-weight="600" fill="#FAFAF7" text-anchor="middle">SRAM</text>
    <text x="0" y="60" font-size="10" font-weight="500" fill="#5C5C5C">分块 + 驻留</text>
    <text x="0" y="76" font-size="10" font-weight="500" fill="#5C5C5C">IO 从 O(n²) → O(n)</text>
  </g>

  <text x="1100" y="568" font-size="11" font-weight="500" fill="#5C5C5C">H100 利用率 35% → 75%</text>

  <!-- ===== BOTTOM-RIGHT: 长上下文 ===== -->
  <line x1="828" y1="628" x2="970" y2="822" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="940" y="820" width="360" height="180" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="960" y="852" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">PLUG 03</text>
  <text x="960" y="886" font-size="24" font-weight="700" fill="#0F0F0F">长上下文</text>
  <text x="960" y="908" font-size="12" font-weight="500" fill="#5C5C5C">让 attention 摊得开</text>

  <!-- visual: n tokens with sparse attention pattern -->
  <g transform="translate(960, 920)">
    <text x="0" y="14" font-size="10" font-weight="500" fill="#5C5C5C">稀疏 / 线性 注意力:</text>
    <rect x="0" y="22" width="320" height="6" fill="none" stroke="#1A1A1A" stroke-width="0.5"/>
    <line x1="20" y1="22" x2="80" y2="28" stroke="#1A1A1A" stroke-width="0.5"/>
    <line x1="80" y1="28" x2="140" y2="22" stroke="#1A1A1A" stroke-width="0.5"/>
    <line x1="140" y1="22" x2="200" y2="28" stroke="#1A1A1A" stroke-width="0.5"/>
    <line x1="200" y1="28" x2="260" y2="22" stroke="#1A1A1A" stroke-width="0.5"/>
    <line x1="260" y1="22" x2="320" y2="28" stroke="#1A1A1A" stroke-width="0.5"/>
    <text x="0" y="56" font-size="10" font-weight="500" fill="#5C5C5C">O(n²) → O(n) / O(n log n)</text>
  </g>

  <text x="960" y="996" font-size="11" font-weight="500" fill="#5C5C5C">Longformer · Mamba · Ring Attention</text>

  <!-- ===== BOTTOM-LEFT: RAG ===== -->
  <line x1="772" y1="628" x2="630" y2="822" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="260" y="820" width="360" height="180" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="280" y="852" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">PLUG 04</text>
  <text x="280" y="886" font-size="24" font-weight="700" fill="#0F0F0F">RAG</text>
  <text x="280" y="908" font-size="12" font-weight="500" fill="#5C5C5C">外挂记忆 = 现场查资料</text>

  <!-- visual: query → vector DB → context → LLM -->
  <g transform="translate(280, 920)">
    <rect x="0" y="0" width="60" height="32" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="30" y="20" font-size="10" font-weight="600" fill="#0F0F0F" text-anchor="middle">Query</text>
    <line x1="60" y1="16" x2="100" y2="16" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r6)"/>
    <rect x="100" y="0" width="80" height="32" fill="#1A1A1A"/>
    <text x="140" y="20" font-size="10" font-weight="600" fill="#FAFAF7" text-anchor="middle">Vector DB</text>
    <line x1="180" y1="16" x2="220" y2="16" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r6)"/>
    <rect x="220" y="0" width="100" height="32" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="270" y="20" font-size="10" font-weight="600" fill="#0F0F0F" text-anchor="middle">Context</text>
    <text x="0" y="58" font-size="10" font-weight="500" fill="#5C5C5C">实时知识 · 私有文档</text>
  </g>

  <text x="280" y="996" font-size="11" font-weight="500" fill="#5C5C5C">LlamaIndex · LangChain · 企业知识库</text>

  <!-- ===== TOP-LEFT: Mamba ===== -->
  <line x1="772" y1="572" x2="520" y2="528" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="160" y="400" width="360" height="180" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="180" y="432" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">PLUG 05</text>
  <text x="180" y="466" font-size="24" font-weight="700" fill="#0F0F0F">Mamba / SSM</text>
  <text x="180" y="488" font-size="12" font-weight="500" fill="#5C5C5C">状态空间，O(n) 线性</text>

  <!-- visual: h_t = A h_{t-1} + B x_t -->
  <g transform="translate(180, 500)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="20" y="24" font-size="10" font-weight="600" fill="#0F0F0F" text-anchor="middle">h</text>
    <line x1="34" y1="20" x2="64" y2="20" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r6)"/>
    <circle cx="78" cy="20" r="14" fill="#1A1A1A"/>
    <text x="78" y="24" font-size="10" font-weight="600" fill="#FAFAF7" text-anchor="middle">h'</text>
    <line x1="92" y1="20" x2="122" y2="20" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r6)"/>
    <circle cx="136" cy="20" r="14" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="136" y="24" font-size="10" font-weight="600" fill="#0F0F0F" text-anchor="middle">h''</text>
    <line x1="150" y1="20" x2="180" y2="20" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r6)"/>
    <circle cx="194" cy="20" r="14" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="194" y="24" font-size="10" font-weight="600" fill="#0F0F0F" text-anchor="middle">y</text>

    <text x="0" y="58" font-size="10" font-weight="500" fill="#5C5C5C">线性递推 · 内存 O(1)</text>
  </g>

  <text x="180" y="568" font-size="11" font-weight="500" fill="#5C5C5C">Mamba · Mamba-2 · Jamba（混合）</text>

  <!-- ============ FOOTER ============ -->
  <line x1="80" y1="1010" x2="1520" y2="1010" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="80" y="1040" font-size="11" font-weight="500" fill="#5C5C5C">Jamba 1.5（52B）= Transformer + MoE + Mamba 混合；Llama 3 + Flash Attention + 长上下文是 2024-2025 的"工业界基线配方"。</text>
  <text x="1520" y="1040" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="end">详见 §3.2</text>
</svg>
