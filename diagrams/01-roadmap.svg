<svg viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- canvas -->
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <!-- outer frame -->
  <rect x="32" y="32" width="1536" height="1036" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- TOP: left title -->
  <text x="80" y="92" font-size="48" font-weight="700" fill="#0F0F0F" letter-spacing="-1">本文地图</text>
  <text x="80" y="118" font-size="12" font-weight="500" fill="#8C8C8C" letter-spacing="3">FROM QUESTION TO MENTAL MODEL</text>

  <!-- TOP: right meta -->
  <text x="1520" y="92" font-size="14" font-weight="600" fill="#0F0F0F" text-anchor="end">一文搞懂 LLM 架构与 Prompt 工程</text>
  <text x="1520" y="115" font-size="11" font-weight="400" fill="#5C5C5C" text-anchor="end">7 章节 · 9 公式块 · 1 张复杂度表</text>

  <!-- separator -->
  <line x1="32" y1="148" x2="1568" y2="148" stroke="#1A1A1A" stroke-width="1"/>

  <!-- timeline spine -->
  <line x1="200" y1="200" x2="200" y2="990" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- node 00 -->
  <circle cx="200" cy="220" r="8" fill="#1A1A1A"/>
  <text x="240" y="218" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">00</text>
  <text x="300" y="218" font-size="22" font-weight="600" fill="#0F0F0F">为什么要从一个问题开始</text>
  <text x="240" y="246" font-size="14" font-weight="400" fill="#5C5C5C">从 ChatGPT 的"对话"表象出发，提出全文要回答的 5 个核心问题。</text>

  <!-- node 01 -->
  <circle cx="200" cy="340" r="8" fill="#1A1A1A"/>
  <text x="240" y="338" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">01</text>
  <text x="300" y="338" font-size="22" font-weight="600" fill="#0F0F0F">Transformer：2017 年那篇论文</text>
  <text x="240" y="366" font-size="14" font-weight="400" fill="#5C5C5C">attention 机制、位置编码、多头注意力、残差网络 —— 所有 LLM 的共同祖先。</text>

  <!-- node 02 -->
  <circle cx="200" cy="460" r="8" fill="#1A1A1A"/>
  <text x="240" y="458" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">02</text>
  <text x="300" y="458" font-size="22" font-weight="600" fill="#0F0F0F">三个绕不开的概念</text>
  <text x="240" y="486" font-size="14" font-weight="400" fill="#5C5C5C">token · context window · attention —— 最容易混淆的三个概念一次讲清。</text>

  <!-- node 03 -->
  <circle cx="200" cy="580" r="8" fill="#1A1A1A"/>
  <text x="240" y="578" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">03</text>
  <text x="300" y="578" font-size="22" font-weight="600" fill="#0F0F0F">主流 LLM 架构变体</text>
  <text x="240" y="606" font-size="14" font-weight="400" fill="#5C5C5C">三大主骨架 + 五大外挂：MoE · RAG · 长上下文 · Flash Attention · Mamba。</text>

  <!-- node 04 -->
  <circle cx="200" cy="700" r="8" fill="#1A1A1A"/>
  <text x="240" y="698" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">04</text>
  <text x="300" y="698" font-size="22" font-weight="600" fill="#0F0F0F">训练一个 LLM 的流程</text>
  <text x="240" y="726" font-size="14" font-weight="400" fill="#5C5C5C">预训练 → SFT → Instruction → RLHF —— 四个阶段，每个阶段的损失函数。</text>

  <!-- node 05 -->
  <circle cx="200" cy="820" r="8" fill="#1A1A1A"/>
  <text x="240" y="818" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">05</text>
  <text x="300" y="818" font-size="22" font-weight="600" fill="#0F0F0F">Prompt 工程：从咒语到接口设计</text>
  <text x="240" y="846" font-size="14" font-weight="400" fill="#5C5C5C">Zero-shot · Few-shot · CoT · ReAct · System Prompt + 三个真实工程案例。</text>

  <!-- node 06 -->
  <circle cx="200" cy="940" r="8" fill="#1A1A1A"/>
  <text x="240" y="938" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="2">06</text>
  <text x="300" y="938" font-size="22" font-weight="600" fill="#0F0F0F">五个核心判断</text>
  <text x="240" y="966" font-size="14" font-weight="400" fill="#5C5C5C">回到起点：学完之后，你应该能用一句话解释 LLM 不是魔法这件事。</text>

  <!-- footer note -->
  <line x1="240" y1="1010" x2="1560" y2="1010" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="240" y="1036" font-size="11" font-weight="400" fill="#8C8C8C">每个节点包含 1–3 个可跳过的公式块。工程经验直接读正文，公式推导按需展开。</text>
</svg>