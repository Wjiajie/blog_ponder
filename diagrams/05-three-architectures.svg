<svg viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-r5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- canvas + frame -->
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <rect x="32" y="32" width="1536" height="1036" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- header -->
  <text x="80" y="92" font-size="40" font-weight="700" fill="#0F0F0F" letter-spacing="-0.5">三大主骨架：decoder · encoder · encoder-decoder</text>
  <text x="80" y="118" font-size="12" font-weight="500" fill="#8C8C8C" letter-spacing="2.5">THREE ARCHITECTURE FAMILIES</text>
  <text x="1520" y="92" font-size="13" font-weight="500" fill="#5C5C5C" text-anchor="end">第 3.1 节 · 架构选择</text>
  <line x1="32" y1="148" x2="1568" y2="148" stroke="#1A1A1A" stroke-width="1"/>

  <!-- intro -->
  <text x="80" y="194" font-size="14" font-weight="500" fill="#0F0F0F">把当前所有主流 LLM 归到三大类——选择哪类，决定了它"擅长什么、不擅长什么"。</text>

  <!-- ============ 3 COLUMN CARDS ============ -->
  <!-- Card geometry: y=240 to y=940; each card 460 wide, 32 gap -->
  <!-- Card 1: 80-540, Card 2: 572-1032, Card 3: 1064-1524 -->

  <!-- CARD 1: Decoder-only -->
  <rect x="80" y="240" width="460" height="700" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="80" y="240" width="460" height="48" fill="#1A1A1A"/>
  <text x="100" y="272" font-size="12" font-weight="700" fill="#FAFAF7" letter-spacing="2">COLUMN 01</text>
  <text x="520" y="272" font-size="12" font-weight="700" fill="#FAFAF7" letter-spacing="2" text-anchor="end">★ TODAY'S DEFAULT</text>

  <text x="110" y="328" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">ARCHITECTURE</text>
  <text x="110" y="362" font-size="28" font-weight="700" fill="#0F0F0F">decoder-only</text>
  <text x="110" y="386" font-size="13" font-weight="500" fill="#5C5C5C">只保留解码器，单向（causal）</text>

  <!-- Visual: stacked decoder blocks with input/output -->
  <g transform="translate(110, 410)">
    <!-- input arrows up -->
    <text x="180" y="22" font-size="11" font-weight="500" fill="#5C5C5C" text-anchor="middle">输入 tokens</text>
    <line x1="120" y1="40" x2="120" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="180" y1="40" x2="180" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="240" y1="40" x2="240" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="300" y1="40" x2="300" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>

    <!-- 3 decoder blocks stacked -->
    <rect x="60" y="80" width="300" height="44" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="210" y="107" font-size="13" font-weight="600" fill="#0F0F0F" text-anchor="middle">Masked Self-Attention + FFN</text>

    <rect x="60" y="130" width="300" height="44" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="210" y="157" font-size="13" font-weight="600" fill="#0F0F0F" text-anchor="middle">Masked Self-Attention + FFN</text>

    <rect x="60" y="180" width="300" height="44" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="210" y="207" font-size="13" font-weight="600" fill="#0F0F0F" text-anchor="middle">Masked Self-Attention + FFN</text>

    <!-- output -->
    <text x="210" y="258" font-size="11" font-weight="500" fill="#5C5C5C" text-anchor="middle">下一个 token →</text>
  </g>

  <!-- representative models -->
  <line x1="110" y1="700" x2="510" y2="700" stroke="#1A1A1A" stroke-width="0.5"/>
  <text x="110" y="730" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">代表模型</text>
  <text x="110" y="758" font-size="14" font-weight="500" fill="#0F0F0F">GPT-4 / Claude 3.5 / Llama 3</text>
  <text x="110" y="780" font-size="14" font-weight="500" fill="#0F0F0F">Qwen / ChatGPT / Copilot</text>

  <text x="110" y="824" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">擅长</text>
  <text x="110" y="852" font-size="14" font-weight="500" fill="#0F0F0F">· 开放对话 / 文案 / 代码生成</text>
  <text x="110" y="876" font-size="14" font-weight="500" fill="#0F0F0F">· 训练目标 = 预测下一个 token</text>
  <text x="110" y="900" font-size="14" font-weight="500" fill="#0F0F0F">· 天然匹配对话生成</text>

  <!-- bottom: 比喻 -->
  <line x1="110" y1="916" x2="510" y2="916" stroke="#1A1A1A" stroke-width="0.3" stroke-dasharray="2 4"/>
  <text x="110" y="938" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">比喻</text>

  <!-- CARD 2: Encoder-only -->
  <rect x="572" y="240" width="460" height="700" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="572" y="240" width="460" height="48" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="592" y="272" font-size="12" font-weight="700" fill="#0F0F0F" letter-spacing="2">COLUMN 02</text>
  <text x="1012" y="272" font-size="12" font-weight="700" fill="#0F0F0F" letter-spacing="2" text-anchor="end">UNDERSTANDING</text>

  <text x="602" y="328" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">ARCHITECTURE</text>
  <text x="602" y="362" font-size="28" font-weight="700" fill="#0F0F0F">encoder-only</text>
  <text x="602" y="386" font-size="13" font-weight="500" fill="#5C5C5C">只保留编码器，双向（bidirectional）</text>

  <!-- Visual: encoder with bidirectional arrows -->
  <g transform="translate(602, 410)">
    <text x="180" y="22" font-size="11" font-weight="500" fill="#5C5C5C" text-anchor="middle">输入 tokens</text>
    <line x1="120" y1="40" x2="120" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="180" y1="40" x2="180" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="240" y1="40" x2="240" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="300" y1="40" x2="300" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>

    <rect x="60" y="80" width="300" height="44" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="210" y="107" font-size="13" font-weight="600" fill="#0F0F0F" text-anchor="middle">Bidirectional Self-Attention</text>

    <rect x="60" y="130" width="300" height="44" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="210" y="157" font-size="13" font-weight="600" fill="#0F0F0F" text-anchor="middle">Bidirectional Self-Attention</text>

    <rect x="60" y="180" width="300" height="44" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="210" y="207" font-size="13" font-weight="600" fill="#0F0F0F" text-anchor="middle">Bidirectional Self-Attention</text>

    <text x="210" y="258" font-size="11" font-weight="500" fill="#5C5C5C" text-anchor="middle">每个 token 的向量表示 →</text>
  </g>

  <line x1="602" y1="700" x2="1002" y2="700" stroke="#1A1A1A" stroke-width="0.5"/>
  <text x="602" y="730" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">代表模型</text>
  <text x="602" y="758" font-size="14" font-weight="500" fill="#0F0F0F">BERT / RoBERTa / DistilBERT</text>
  <text x="602" y="780" font-size="14" font-weight="500" fill="#0F0F0F">Sentence-BERT / E5 / BGE</text>

  <text x="602" y="824" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">擅长</text>
  <text x="602" y="852" font-size="14" font-weight="500" fill="#0F0F0F">· 文本分类 / 检索 / 匹配</text>
  <text x="602" y="876" font-size="14" font-weight="500" fill="#0F0F0F">· 把文字读成向量（embedding）</text>
  <text x="602" y="900" font-size="14" font-weight="500" fill="#0F0F0F">· 不擅长"接着写"（无生成头）</text>

  <line x1="602" y1="916" x2="1002" y2="916" stroke="#1A1A1A" stroke-width="0.3" stroke-dasharray="2 4"/>
  <text x="602" y="938" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">比喻</text>

  <!-- CARD 3: Encoder-Decoder -->
  <rect x="1064" y="240" width="460" height="700" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="1064" y="240" width="460" height="48" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1084" y="272" font-size="12" font-weight="700" fill="#0F0F0F" letter-spacing="2">COLUMN 03</text>
  <text x="1504" y="272" font-size="12" font-weight="700" fill="#0F0F0F" letter-spacing="2" text-anchor="end">TRANSLATION</text>

  <text x="1094" y="328" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">ARCHITECTURE</text>
  <text x="1094" y="362" font-size="28" font-weight="700" fill="#0F0F0F">encoder-decoder</text>
  <text x="1094" y="386" font-size="13" font-weight="500" fill="#5C5C5C">编码 + 解码都有，跨注意力桥接</text>

  <!-- Visual: encoder stack on left, decoder stack on right, with cross attention -->
  <g transform="translate(1094, 410)">
    <text x="80" y="22" font-size="11" font-weight="500" fill="#5C5C5C" text-anchor="middle">输入 X</text>
    <text x="320" y="22" font-size="11" font-weight="500" fill="#5C5C5C" text-anchor="middle">输出 Y</text>

    <!-- input arrows up -->
    <line x1="50" y1="40" x2="50" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="110" y1="40" x2="110" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>

    <!-- output arrows up -->
    <line x1="290" y1="40" x2="290" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>
    <line x1="350" y1="40" x2="350" y2="80" stroke="#5C5C5C" stroke-width="1" marker-end="url(#arr-r5)"/>

    <!-- encoder (left) -->
    <rect x="20" y="80" width="120" height="40" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="80" y="104" font-size="11" font-weight="600" fill="#0F0F0F" text-anchor="middle">Encoder</text>

    <rect x="20" y="125" width="120" height="40" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="80" y="149" font-size="11" font-weight="600" fill="#0F0F0F" text-anchor="middle">Encoder</text>

    <!-- cross attention arrows (diagonal) -->
    <line x1="140" y1="100" x2="200" y2="100" stroke="#5C5C5C" stroke-width="0.5" stroke-dasharray="2 2"/>
    <line x1="140" y1="145" x2="200" y2="145" stroke="#5C5C5C" stroke-width="0.5" stroke-dasharray="2 2"/>

    <!-- decoder (right) -->
    <rect x="200" y="80" width="200" height="40" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="300" y="104" font-size="11" font-weight="600" fill="#0F0F0F" text-anchor="middle">Cross-Attn + Self-Attn</text>

    <rect x="200" y="125" width="200" height="40" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="300" y="149" font-size="11" font-weight="600" fill="#0F0F0F" text-anchor="middle">Cross-Attn + Self-Attn</text>

    <text x="210" y="200" font-size="10" font-weight="500" fill="#8C8C8C" text-anchor="middle">↕ 跨注意力</text>
    <text x="210" y="240" font-size="10" font-weight="500" fill="#5C5C5C" text-anchor="middle">(cross-attention 桥接)</text>
  </g>

  <line x1="1094" y1="700" x2="1494" y2="700" stroke="#1A1A1A" stroke-width="0.5"/>
  <text x="1094" y="730" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">代表模型</text>
  <text x="1094" y="758" font-size="14" font-weight="500" fill="#0F0F0F">T5 / BART / mBART / Flan-T5</text>
  <text x="1094" y="780" font-size="14" font-weight="500" fill="#0F0F0F">Whisper（语音）/ NLLB（翻译）</text>

  <text x="1094" y="824" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">擅长</text>
  <text x="1094" y="852" font-size="14" font-weight="500" fill="#0F0F0F">· 输入段 → 输出段（翻译、摘要）</text>
  <text x="1094" y="876" font-size="14" font-weight="500" fill="#0F0F0F">· 结构化转换（JSON → SQL 等）</text>
  <text x="1094" y="900" font-size="14" font-weight="500" fill="#0F0F0F">· 输入输出形态不同的任务</text>

  <line x1="1094" y1="916" x2="1494" y2="916" stroke="#1A1A1A" stroke-width="0.3" stroke-dasharray="2 4"/>
  <text x="1094" y="938" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">比喻</text>

  <!-- ============ BOTTOM: 决策一句话 ============ -->
  <line x1="80" y1="970" x2="1520" y2="970" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="80" y="1004" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">一句话选型</text>
  <text x="80" y="1028" font-size="14" font-weight="500" fill="#0F0F0F">开放生成 → decoder-only；分类/检索 → encoder-only；翻译/摘要/转换 → encoder-decoder。</text>
  <text x="80" y="1052" font-size="13" font-weight="400" fill="#5C5C5C">2024-2025 年绝大部分新发布 LLM 都是 decoder-only（GPT/Claude/Llama/Qwen）——causal LM 训练目标最简单也最通用。</text>

  <text x="1520" y="1052" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="end">详见 §3.3 决策树</text>
</svg>
