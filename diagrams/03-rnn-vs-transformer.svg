<svg viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-r3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arr-r3b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#5C5C5C"/>
    </marker>
  </defs>

  <!-- canvas + frame -->
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <rect x="32" y="32" width="1536" height="1036" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- header -->
  <text x="80" y="92" font-size="40" font-weight="700" fill="#0F0F0F" letter-spacing="-0.5">两种"开会方式"：RNN vs Transformer</text>
  <text x="80" y="118" font-size="12" font-weight="500" fill="#8C8C8C" letter-spacing="2.5">SEQUENTIAL MEMORY · PARALLEL ATTENTION</text>
  <text x="1520" y="92" font-size="13" font-weight="500" fill="#5C5C5C" text-anchor="end">第 1 节 · 核心隐喻</text>
  <line x1="32" y1="148" x2="1568" y2="148" stroke="#1A1A1A" stroke-width="1"/>

  <!-- COLUMN DIVIDER -->
  <line x1="800" y1="148" x2="800" y2="1000" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="2 6"/>

  <!-- ============ LEFT COLUMN: RNN ============ -->
  <text x="120" y="200" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">LEFT · RNN</text>
  <text x="120" y="244" font-size="32" font-weight="700" fill="#0F0F0F">串行传递</text>
  <text x="120" y="270" font-size="14" font-weight="400" fill="#5C5C5C">每个时刻只听上一位发言者，靠记忆累积。</text>

  <!-- RNN timeline (5 nodes connected by arrows) -->
  <!-- baseline y=460, x = 200, 340, 480, 620, 760 -->
  <text x="200" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=1</text>
  <text x="340" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=2</text>
  <text x="480" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=3</text>
  <text x="620" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=4</text>
  <text x="760" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=5</text>

  <!-- arrows between nodes -->
  <line x1="232" y1="460" x2="308" y2="460" stroke="#5C5C5C" stroke-width="1.5" marker-end="url(#arr-r3b)"/>
  <line x1="372" y1="460" x2="448" y2="460" stroke="#5C5C5C" stroke-width="1.5" marker-end="url(#arr-r3b)"/>
  <line x1="512" y1="460" x2="588" y2="460" stroke="#5C5C5C" stroke-width="1.5" marker-end="url(#arr-r3b)"/>
  <line x1="652" y1="460" x2="728" y2="460" stroke="#5C5C5C" stroke-width="1.5" marker-end="url(#arr-r3b)"/>

  <!-- nodes -->
  <circle cx="200" cy="460" r="22" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="200" y="466" font-size="14" font-weight="600" fill="#0F0F0F" text-anchor="middle">h₁</text>
  <text x="200" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₁</text>

  <circle cx="340" cy="460" r="22" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="340" y="466" font-size="14" font-weight="600" fill="#0F0F0F" text-anchor="middle">h₂</text>
  <text x="340" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₂</text>

  <circle cx="480" cy="460" r="22" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="480" y="466" font-size="14" font-weight="600" fill="#0F0F0F" text-anchor="middle">h₃</text>
  <text x="480" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₃</text>

  <circle cx="620" cy="460" r="22" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="620" y="466" font-size="14" font-weight="600" fill="#0F0F0F" text-anchor="middle">h₄</text>
  <text x="620" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₄</text>

  <circle cx="760" cy="460" r="22" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="760" y="466" font-size="14" font-weight="600" fill="#0F0F0F" text-anchor="middle">h₅</text>
  <text x="760" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₅</text>

  <!-- memory fade indicator: gradient bars under nodes -->
  <rect x="178" y="544" width="44" height="6" fill="#1A1A1A"/>
  <rect x="318" y="544" width="44" height="4" fill="#5C5C5C"/>
  <rect x="458" y="544" width="44" height="3" fill="#8C8C8C"/>
  <rect x="598" y="544" width="44" height="2" fill="#A8A8A8"/>
  <rect x="738" y="544" width="44" height="1" fill="#C0C0C0"/>
  <text x="120" y="550" font-size="11" font-weight="500" fill="#5C5C5C">记忆强度 →</text>
  <text x="120" y="588" font-size="12" font-weight="500" fill="#5C5C5C" font-style="italic">开头的信息被逐渐稀释</text>

  <!-- characteristics list -->
  <text x="120" y="650" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">特点</text>
  <text x="120" y="684" font-size="14" font-weight="500" fill="#0F0F0F">· 必须按顺序处理（不能并行）</text>
  <text x="120" y="714" font-size="14" font-weight="500" fill="#0F0F0F">· 长序列：开头信息衰减到接近零</text>
  <text x="120" y="744" font-size="14" font-weight="500" fill="#0F0F0F">· 训练慢（顺序依赖，难 GPU 加速）</text>

  <text x="120" y="800" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">比喻</text>
  <text x="120" y="830" font-size="14" font-weight="500" fill="#0F0F0F" font-style="italic">你只能听上一位的话——</text>
  <text x="120" y="854" font-size="14" font-weight="500" fill="#0F0F0F" font-style="italic">背一篇 5000 字文章，</text>
  <text x="120" y="878" font-size="14" font-weight="500" fill="#0F0F0F" font-style="italic">背到最后，开头已经忘了。</text>

  <text x="120" y="942" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">复杂度</text>
  <text x="120" y="972" font-size="16" font-weight="600" fill="#0F0F0F">O(n) 串行</text>

  <!-- ============ RIGHT COLUMN: Transformer ============ -->
  <text x="880" y="200" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2">RIGHT · TRANSFORMER</text>
  <text x="880" y="244" font-size="32" font-weight="700" fill="#0F0F0F">两两互联</text>
  <text x="880" y="270" font-size="14" font-weight="400" fill="#5C5C5C">每个位置直接看所有其他位置，权重动态学习。</text>

  <!-- Transformer: 5 nodes with full mesh connections -->
  <!-- baseline y=460, x = 960, 1100, 1240, 1380, 1520 -->
  <text x="960" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=1</text>
  <text x="1100" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=2</text>
  <text x="1240" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=3</text>
  <text x="1380" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=4</text>
  <text x="1520" y="396" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">t=5</text>

  <!-- all 20 connections (C(5,2) * 2 = 20 directed, we show undirected) -->
  <!-- nodes at y=460, all connections -->
  <g stroke="#C0C0C0" stroke-width="0.4">
    <!-- row 960 -->
    <line x1="960" y1="460" x2="1100" y2="460"/>
    <line x1="960" y1="460" x2="1240" y2="460"/>
    <line x1="960" y1="460" x2="1380" y2="460"/>
    <line x1="960" y1="460" x2="1520" y2="460"/>
    <!-- row 1100 -->
    <line x1="1100" y1="460" x2="1240" y2="460"/>
    <line x1="1100" y1="460" x2="1380" y2="460"/>
    <line x1="1100" y1="460" x2="1520" y2="460"/>
    <!-- row 1240 -->
    <line x1="1240" y1="460" x2="1380" y2="460"/>
    <line x1="1240" y1="460" x2="1520" y2="460"/>
    <!-- row 1380 -->
    <line x1="1380" y1="460" x2="1520" y2="460"/>
  </g>

  <!-- nodes (drawn on top) -->
  <circle cx="960" cy="460" r="24" fill="#1A1A1A"/>
  <text x="960" y="466" font-size="14" font-weight="600" fill="#FAFAF7" text-anchor="middle">x₁</text>
  <circle cx="1100" cy="460" r="24" fill="#1A1A1A"/>
  <text x="1100" y="466" font-size="14" font-weight="600" fill="#FAFAF7" text-anchor="middle">x₂</text>
  <circle cx="1240" cy="460" r="24" fill="#1A1A1A"/>
  <text x="1240" y="466" font-size="14" font-weight="600" fill="#FAFAF7" text-anchor="middle">x₃</text>
  <circle cx="1380" cy="460" r="24" fill="#1A1A1A"/>
  <text x="1380" y="466" font-size="14" font-weight="600" fill="#FAFAF7" text-anchor="middle">x₄</text>
  <circle cx="1520" cy="460" r="24" fill="#1A1A1A"/>
  <text x="1520" y="466" font-size="14" font-weight="600" fill="#FAFAF7" text-anchor="middle">x₅</text>

  <!-- attention callout: highlight some connections with weight labels -->
  <text x="960" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₁</text>
  <text x="1100" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₂</text>
  <text x="1240" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₃</text>
  <text x="1380" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₄</text>
  <text x="1520" y="510" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">x₅</text>

  <!-- equal attention bar (all positions equally accessible) -->
  <rect x="938" y="544" width="44" height="6" fill="#1A1A1A"/>
  <rect x="1078" y="544" width="44" height="6" fill="#1A1A1A"/>
  <rect x="1218" y="544" width="44" height="6" fill="#1A1A1A"/>
  <rect x="1358" y="544" width="44" height="6" fill="#1A1A1A"/>
  <rect x="1498" y="544" width="44" height="6" fill="#1A1A1A"/>
  <text x="880" y="550" font-size="11" font-weight="500" fill="#5C5C5C">注意力 →</text>
  <text x="880" y="588" font-size="12" font-weight="500" fill="#5C5C5C" font-style="italic">任何位置都能直接访问任何位置</text>

  <!-- characteristics list -->
  <text x="880" y="650" font-size="13" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">特点</text>
  <text x="880" y="684" font-size="14" font-weight="500" fill="#0F0F0F">· 所有位置同时计算（完全并行）</text>
  <text x="880" y="714" font-size="14" font-weight="500" fill="#0F0F0F">· 长距离依赖：距离无关，权重可学</text>
  <text x="880" y="744" font-size="14" font-weight="500" fill="#0F0F0F">· 训练快（GPU 矩阵并行）</text>

  <text x="880" y="800" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">比喻</text>
  <text x="880" y="830" font-size="14" font-weight="500" fill="#0F0F0F" font-style="italic">在场的每个人面前都有白板——</text>
  <text x="880" y="854" font-size="14" font-weight="500" fill="#0F0F0F" font-style="italic">随时转头看任何人、</text>
  <text x="880" y="878" font-size="14" font-weight="500" fill="#0F0F0F" font-style="italic">问任何人"你刚才说的那句话"。</text>

  <text x="880" y="942" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">复杂度</text>
  <text x="880" y="972" font-size="16" font-weight="600" fill="#0F0F0F">O(n²) 注意力矩阵</text>

  <!-- bottom note -->
  <line x1="80" y1="1000" x2="1520" y2="1000" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="80" y="1030" font-size="11" font-weight="500" fill="#5C5C5C">n×n 是关键：100 token = 1 万对，10K token = 1 亿对——这正是"上下文越长越贵"的根源。详见 §2.4。</text>
  <text x="1520" y="1030" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="end">Vaswani et al., 2017</text>
</svg>
