<svg viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-r4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- canvas + frame -->
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <rect x="32" y="32" width="1536" height="1036" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- header -->
  <text x="80" y="92" font-size="40" font-weight="700" fill="#0F0F0F" letter-spacing="-0.5">token · context window · attention</text>
  <text x="80" y="118" font-size="12" font-weight="500" fill="#8C8C8C" letter-spacing="2.5">THREE CONCEPTS, ONE MACHINE</text>
  <text x="1520" y="92" font-size="13" font-weight="500" fill="#5C5C5C" text-anchor="end">第 2 节 · 概念三角</text>
  <line x1="32" y1="148" x2="1568" y2="148" stroke="#1A1A1A" stroke-width="1"/>

  <!-- intro -->
  <text x="80" y="194" font-size="14" font-weight="500" fill="#0F0F0F">这是 LLM 入门最容易混淆的三个概念——用三角关系一次讲清：</text>
  <text x="80" y="216" font-size="13" font-weight="400" fill="#5C5C5C">token 是原材料，context window 是桌面大小，attention 是让桌上所有 token 互相"看一眼"的机制。</text>

  <!-- ============ TRIANGLE LAYOUT ============ -->
  <!-- triangle vertices: top, bottom-left, bottom-right -->
  <!-- top: cx=800, cy=360 -->
  <!-- bottom-left: cx=380, cy=820 -->
  <!-- bottom-right: cx=1220, cy=820 -->

  <!-- edges (triangle) -->
  <line x1="800" y1="360" x2="380" y2="820" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="800" y1="360" x2="1220" y2="820" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="380" y1="820" x2="1220" y2="820" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- edge labels -->
  <!-- top-left edge: token ←context window -->
  <text x="540" y="580" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="middle" transform="rotate(48 540 580)">受限于</text>
  <text x="540" y="600" font-size="11" font-weight="400" fill="#8C8C8C" text-anchor="middle" transform="rotate(48 540 600)">measured in</text>

  <!-- top-right edge: token → attention -->
  <text x="1060" y="580" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="middle" transform="rotate(-48 1060 580)">两两算相似度</text>
  <text x="1060" y="600" font-size="11" font-weight="400" fill="#8C8C8C" text-anchor="middle" transform="rotate(-48 1060 600)">pairwise</text>

  <!-- bottom edge: context window → attention -->
  <text x="800" y="848" font-size="12" font-weight="600" fill="#5C5C5C" text-anchor="middle">决定注意力矩阵大小</text>
  <text x="800" y="866" font-size="11" font-weight="400" fill="#8C8C8C" text-anchor="middle">n×n 复杂度</text>

  <!-- ============ NODE 1: token (top) ============ -->
  <circle cx="800" cy="360" r="100" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="2"/>
  <text x="800" y="338" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2" text-anchor="middle">INPUT UNIT</text>
  <text x="800" y="372" font-size="32" font-weight="700" fill="#0F0F0F" text-anchor="middle">token</text>
  <text x="800" y="394" font-size="13" font-weight="500" fill="#5C5C5C" text-anchor="middle">模型只认的"最小语义单元"</text>

  <!-- token examples inside / below circle -->
  <g font-family="ui-monospace, monospace">
    <rect x="700" y="408" width="200" height="34" fill="none" stroke="#C0C0C0" stroke-width="0.5"/>
    <text x="710" y="430" font-size="13" font-weight="500" fill="#0F0F0F">"今天天气"  → 3 token</text>
  </g>

  <!-- ============ NODE 2: context window (bottom-left) ============ -->
  <circle cx="380" cy="820" r="100" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="2"/>
  <text x="380" y="798" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2" text-anchor="middle">CAPACITY</text>
  <text x="380" y="830" font-size="22" font-weight="700" fill="#0F0F0F" text-anchor="middle">context</text>
  <text x="380" y="854" font-size="22" font-weight="700" fill="#0F0F0F" text-anchor="middle">window</text>
  <text x="380" y="876" font-size="12" font-weight="500" fill="#5C5C5C" text-anchor="middle">圆桌的大小</text>

  <!-- ============ NODE 3: attention (bottom-right) ============ -->
  <circle cx="1220" cy="820" r="100" fill="#FAFAF7" stroke="#1A1A1A" stroke-width="2"/>
  <text x="1220" y="798" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="2" text-anchor="middle">MECHANISM</text>
  <text x="1220" y="830" font-size="30" font-weight="700" fill="#0F0F0F" text-anchor="middle">attention</text>
  <text x="1220" y="852" font-size="13" font-weight="500" fill="#5C5C5C" text-anchor="middle">token 之间互相看的机制</text>

  <!-- ============ DETAIL PANELS BELOW ============ -->
  <line x1="80" y1="970" x2="1520" y2="970" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 3"/>

  <text x="80" y="1004" font-size="11" font-weight="700" fill="#8C8C8C" letter-spacing="1.5">工程含义</text>
  <text x="80" y="1028" font-size="13" font-weight="500" fill="#0F0F0F">三者必须放一起看：context window 决定 n 的大小 → attention 计算 n² 对关系 → 每个位置都消耗 token 预算。</text>
  <text x="80" y="1052" font-size="13" font-weight="500" fill="#5C5C5C">把关键信息放靠前/靠后（Lost in the Middle），中段用过渡材料——这是几乎免费但很有效的工程经验。</text>

  <text x="1520" y="1052" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="end">详见 §2.1 / §2.2 / §2.3</text>
</svg>
