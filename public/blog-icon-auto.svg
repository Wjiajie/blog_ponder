        --bg: #16222B;
        --line: #F7F3EB;
        --accent1: #E08A35;
        --accent2: #5FA7A2;
      }
    }
  </style>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="var(--bg)"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="var(--line)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 147 338 Q 200 285 256 316 Q 312 285 365 338" fill="none" stroke="var(--line)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="256" y1="174" x2="256" y2="314" stroke="var(--line)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="122" cy="252" r="42" fill="var(--accent1, #E08A35)"/>
<rect x="345" y="210" width="86" height="86" rx="22" fill="var(--accent2, #5FA7A2)"/>
</svg>