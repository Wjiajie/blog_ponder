<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Blog icon" preserveAspectRatio="xMidYMid meet">
  <title>Blog icon</title>
  <desc>Adaptive SVG icon with light and dark theme support.</desc>
  <style>
    :root {
      --bg: #F5F1EA;
      --line: #22303B;
      --accent1: #E08A35;
      --accent2: #5FA7A2;
